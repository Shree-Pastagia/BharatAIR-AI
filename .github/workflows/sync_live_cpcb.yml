name: Auto-Sync Live CPCB Telemetry

on:
  schedule:
    # Runs at minute 15 of every hour (e.g. 1:15, 2:15, 3:15 UTC) after CPCB posts hourly data
    - cron: '15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: sync-cpcb-telemetry
  cancel-in-progress: true

jobs:
  sync:
    name: Poll Government CAAQMS & Update Web Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Fetch Live CPCB Telemetry
        env:
          OGD_API_KEY: ${{ secrets.OGD_API_KEY }}
        run: |
          python scripts/fetch_live_cpcb.py

      - name: Commit and Push Updated Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/live_cpcb_telemetry.json web/src/data/live_cpcb_telemetry.json
          if git diff --staged --quiet; then
            echo "No new telemetry changes observed. Skipping commit."
          else
            git commit -m "chore(telemetry): auto-sync live CPCB observations [skip ci]"
            git push
            echo "Successfully synced and pushed new CPCB telemetry to repository!"
          fi
